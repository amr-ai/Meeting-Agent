[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-voice-agent"
version = "0.1.0"
description = "Python native-audio meeting participant using Gemini Live, LiveKit, Recall and LangGraph"
requires-python = ">=3.11"
dependencies = [
  "livekit-agents==1.8.11", "livekit-plugins-google==1.8.11", "livekit-api==1.2.2",
  "fastapi==0.162.0", "uvicorn==0.54.0", "pydantic==2.14.3",
  "pydantic-settings==2.16.2", "aiosqlite==0.22.1", "httpx==0.28.1",
  "langgraph==1.2.20", "PyJWT==2.15.1", "aiofiles==25.1.0", "google-genai==3.0.0"
]

[project.optional-dependencies]
screen = ["av==19.0.2", "numpy==2.5.4"]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "respx==0.23.1", "ruff==0.17.4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "ASYNC"]
